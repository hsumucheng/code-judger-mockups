<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>停用單位 AI 導師 — 互動提醒視窗</title>
<style>
  :root {
    --navy: #2b3245;
    --navy-dark: #232939;
    --teal: #22b8c8;
    --pink: #ef7e8b;
    --pink-dark: #e8697a;
    --red-bg: #f6626c;
    --text-main: #2b3245;
    --text-muted: #8a8f9c;
    --border: #e6e8ec;
    --page-bg: #f4f5f7;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--page-bg);
    font-family: "Noto Sans TC", "Microsoft JhengHei", -apple-system, sans-serif;
    color: var(--text-main);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .trigger-btn {
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 12px 22px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  /* ---------- overlay + modal ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(35, 41, 57, 0.45);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .overlay.show { display: flex; }

  .modal {
    background: #ffffff;
    width: 460px;
    max-width: 92vw;
    border-radius: 10px;
    box-shadow: 0 12px 32px rgba(35, 41, 57, 0.18);
    padding: 22px 26px 20px;
  }

  .modal-title {
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    margin: 4px 0 16px;
  }

  .modal-divider {
    border: none;
    border-top: 1px solid var(--border);
    margin: 0 -26px 16px;
  }

  .modal-body-text {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-main);
    margin: 0 0 18px;
  }

  .modal-body-text b { font-weight: 700; }

  /* warning banner (stage 2) */
  .warning-banner {
    background: var(--red-bg);
    color: #fff;
    font-size: 13px;
    line-height: 1.7;
    border-radius: 6px;
    padding: 12px 14px;
    margin-bottom: 16px;
  }

  .warning-banner b { font-weight: 700; }

  /* option rows */
  .option-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
    cursor: pointer;
    user-select: none;
  }

  .option-row input[type="checkbox"] {
    display: none;
  }

  .check-box {
    width: 18px;
    height: 18px;
    border-radius: 4px;
    border: 1.5px solid #c7cad3;
    background: #fff;
    flex-shrink: 0;
    position: relative;
    transition: background 0.15s, border-color 0.15s;
  }

  .option-row input[type="checkbox"]:checked + .check-box {
    background: var(--teal);
    border-color: var(--teal);
  }

  .option-row input[type="checkbox"]:checked + .check-box::after {
    content: "";
    position: absolute;
    left: 5px;
    top: 1px;
    width: 5px;
    height: 9px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }

  /* radio-style variant: 圓形，避免使用者誤以為可複選 */
  .check-box.radio-style {
    border-radius: 50%;
  }

  .option-row input[type="checkbox"]:checked + .check-box.radio-style::after {
    left: 50%;
    top: 50%;
    width: 8px;
    height: 8px;
    border: none;
    background: #fff;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  .option-row.disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #row-recycle-2 {
    cursor: default;
    pointer-events: none;
  }

  .option-label {
    font-size: 14px;
    color: var(--text-main);
  }

  /* footer buttons */
  .modal-footer {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 20px;
  }

  .btn-cancel {
    background: var(--navy);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  .btn-confirm {
    background: var(--pink);
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }

  .btn-confirm:disabled {
    background: #f3c3ca;
    cursor: not-allowed;
  }

  .stage { display: none; }
  .stage.active { display: block; }

  /* ---------- stage 3: 成功結果畫面 ---------- */
  .success-icon-circle {
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background: #63bf7a;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 8px auto 18px;
  }

  .success-title {
    text-align: center;
    font-size: 18px;
    font-weight: 700;
    margin: 0 0 10px;
  }

  .success-subtitle {
    text-align: center;
    font-size: 13px;
    line-height: 1.8;
    color: var(--text-muted);
    margin: 0;
    padding: 0 6px;
  }

  .success-footer {
    margin: 22px -26px -20px;
    border-top: 1px solid var(--border);
    display: none;
  }

  .btn-success-confirm {
    width: 100%;
    background: #63bf7a;
    color: #fff;
    border: none;
    padding: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    border-radius: 0 0 10px 10px;
  }

  .btn-success-confirm:hover { background: #57ab6c; }
</style>
</head>
<body>

<button class="trigger-btn" id="openBtn">停用單位 AI 導師</button>

<div class="overlay" id="overlay">
  <div class="modal">
    <div id="mainHeader">
      <p class="modal-title">停用單位 AI 導師</p>
      <hr class="modal-divider">
    </div>

    <!-- Stage 1: 預設選擇畫面 -->
    <div class="stage active" id="stage1">
      <p class="modal-body-text">
        即將停用 <b>TQC+</b> 的 AI 導師功能。停用後，該單位旗下所有課程都無法再呼叫 AI。
      </p>

      <label class="option-row" id="row-no-recycle">
        <input type="checkbox" id="cb-no-recycle" checked>
        <span class="check-box radio-style"></span>
        <span class="option-label">不回收旗下所有課程的剩餘額度</span>
      </label>

      <label class="option-row" id="row-recycle-1">
        <input type="checkbox" id="cb-recycle-1">
        <span class="check-box radio-style"></span>
        <span class="option-label">一併回收旗下所有課程的剩餘額度</span>
      </label>
    </div>

    <!-- Stage 2: 二次確認畫面 -->
    <div class="stage" id="stage2">
      <div class="warning-banner">
        再按一次，就會掃過 <b>TQC+</b> 旗下的每一門課程，把各課程剩餘的額度全部回收回單位，並停用 AI 導師。此操作會逐課寫入異動歷程，且無法一鍵復原。
      </div>

      <label class="option-row" id="row-recycle-2">
        <input type="checkbox" id="cb-recycle-2" checked disabled>
        <span class="check-box radio-style"></span>
        <span class="option-label">一併回收旗下所有課程的剩餘額度</span>
      </label>

      <label class="option-row" id="row-understand">
        <input type="checkbox" id="cb-understand">
        <span class="check-box"></span>
        <span class="option-label">我了解這會回收旗下所有課程的剩餘額度</span>
      </label>
    </div>

    <!-- Stage 3: 成功結果畫面 -->
    <div class="stage" id="stage3">
      <div class="success-icon-circle">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
          <path d="M5 13l4 4L19 7" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <p class="success-title">已停用 AI 導師</p>
      <p class="success-subtitle" id="successSubtitle">該單位尚餘 99,998,001 Token，停用後額度原地凍結，不會消失。</p>
    </div>

    <div class="modal-footer" id="mainFooter">
      <button class="btn-cancel" id="cancelBtn">取消</button>
      <button class="btn-confirm" id="confirmBtn" disabled>停用</button>
    </div>

    <div class="success-footer" id="successFooter">
      <button class="btn-success-confirm" id="successConfirmBtn">確認</button>
    </div>
  </div>
</div>

<script>
  const overlay = document.getElementById('overlay');
  const openBtn = document.getElementById('openBtn');
  const cancelBtn = document.getElementById('cancelBtn');
  const confirmBtn = document.getElementById('confirmBtn');

  const mainHeader = document.getElementById('mainHeader');
  const mainFooter = document.getElementById('mainFooter');
  const successFooter = document.getElementById('successFooter');
  const successConfirmBtn = document.getElementById('successConfirmBtn');
  const successSubtitle = document.getElementById('successSubtitle');

  const stage1 = document.getElementById('stage1');
  const stage2 = document.getElementById('stage2');
  const stage3 = document.getElementById('stage3');

  const cbNoRecycle = document.getElementById('cb-no-recycle');
  const cbRecycle1 = document.getElementById('cb-recycle-1');
  const cbRecycle2 = document.getElementById('cb-recycle-2');
  const cbUnderstand = document.getElementById('cb-understand');

  function resetModal() {
    cbNoRecycle.checked = true;
    cbRecycle1.checked = false;
    cbRecycle2.checked = true;
    cbUnderstand.checked = false;

    mainHeader.style.display = '';
    mainFooter.style.display = '';
    successFooter.style.display = 'none';

    stage1.classList.add('active');
    stage2.classList.remove('active');
    stage3.classList.remove('active');
    updateConfirmButton();
  }

  function updateConfirmButton() {
    if (stage2.classList.contains('active')) {
      confirmBtn.textContent = '確定回收所有課程額度並停用';
      confirmBtn.disabled = !cbUnderstand.checked;
    } else {
      confirmBtn.textContent = '停用';
      confirmBtn.disabled = false;
    }
  }

  function goToStage2() {
    stage1.classList.remove('active');
    stage2.classList.add('active');
    cbRecycle2.checked = true;
    cbUnderstand.checked = false;
    updateConfirmButton();
  }

  function goToStage1() {
    stage2.classList.remove('active');
    stage1.classList.add('active');
    cbNoRecycle.checked = true;
    cbRecycle1.checked = false;
    updateConfirmButton();
  }

  function goToStage3(type) {
    mainHeader.style.display = 'none';
    mainFooter.style.display = 'none';
    stage1.classList.remove('active');
    stage2.classList.remove('active');
    stage3.classList.add('active');
    successFooter.style.display = 'block';

    if (type === 'recycle') {
      // 範例數值，實際串接時請帶入本次真實回收的 Token 總量
      successSubtitle.textContent = '本次一併回收 1,000 Token';
    } else {
      // 範例數值，實際串接時請帶入該單位目前尚餘的 Token 總量
      successSubtitle.textContent = '該單位尚餘 99,998,001 Token，停用後額度原地凍結，不會消失。';
    }
  }

  // Stage 1 interactions
  cbNoRecycle.addEventListener('change', function () {
    if (this.checked) {
      cbRecycle1.checked = false;
    } else {
      // 不允許兩者都不勾，強制保持勾選
      this.checked = true;
    }
  });

  cbRecycle1.addEventListener('change', function () {
    if (this.checked) {
      cbNoRecycle.checked = false;
      goToStage2();
    }
  });

  // Stage 2「一併回收」為延續上一步的已選狀態，透過 disabled 屬性
  // 與 pointer-events:none（見 CSS）讓它完全無法被點擊或取消選取

  cbUnderstand.addEventListener('change', function () {
    updateConfirmButton();
  });

  // open / close
  openBtn.addEventListener('click', function () {
    resetModal();
    overlay.classList.add('show');
  });

  cancelBtn.addEventListener('click', function () {
    if (stage2.classList.contains('active')) {
      goToStage1();
    } else {
      overlay.classList.remove('show');
    }
  });

  confirmBtn.addEventListener('click', function () {
    if (stage2.classList.contains('active')) {
      if (!cbUnderstand.checked) return;
      goToStage3('recycle');
    } else {
      goToStage3('no-recycle');
    }
  });

  successConfirmBtn.addEventListener('click', function () {
    overlay.classList.remove('show');
  });
</script>

</body>
</html>
